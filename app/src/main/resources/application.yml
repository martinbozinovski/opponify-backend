spring:
  application:
    name: opponify-backend
  jackson:
    time-zone: UTC
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${FIREBASE_ISSUER_URI:}

server:
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

opponify:
  idempotency:
    ttl: PT48H
  participation:
    request-expiry: PT48H
  scheduling:
    time-proposal-expiry: PT24H
    material-change-expiry: PT48H
    default-game-duration: PT90M
  post-game:
    resolution-window: PT48H
  discovery:
    radii-km: 2,5,10,25
  security:
    dev-mode: ${OPPONIFY_SECURITY_DEV_MODE:false}
